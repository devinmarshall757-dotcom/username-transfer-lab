name: Local simulation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lab.txt
      - run: python -m unittest -q
      - run: python recovery_campaign.py --output artifacts/ci-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-evidence-${{ matrix.os }}
          path: artifacts/ci-recovery/report.json
